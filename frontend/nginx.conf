server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loads.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Serve the Vite build output; fall back to index.html so client-side
    # routes (React Router) work correctly on refresh/direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets emitted by Vite.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
